```html
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulación de Historia</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      /* Contenedor */
      .story {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: url(./publi.jpg) center / cover;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        background-size: 100% 83%;
        background-repeat: no-repeat;
        position: absolute;
        background-position: 10 79px;
      }

      /* Oscurecer ligeramente la imagen */
      .story::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.35),
          rgba(0, 0, 0, 0.05),
          rgba(0, 0, 0, 0.45)
        );
      }

      /* Barra de progreso */
      .progress {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        height: 3px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        z-index: 5;
      }

      .progress span {
        display: block;
        height: 100%;
        width: 0;
        background: #fff;
        border-radius: 20px;
        animation: story 1000s linear forwards;
      }

      @keyframes story {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }

      /* Cabecera */
      .header {
        position: absolute;
        top: 24px;
        left: 15px;
        right: 15px;
        display: flex;
        align-items: center;
        color: white;
        z-index: 5;
      }

      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #ff2d75;
        overflow: hidden;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .info {
        margin-left: 10px;
      }

      .user {
        font-weight: bold;
        font-size: 14px;
      }

      .time {
        font-size: 12px;
        opacity: 0.8;
      }

      .more {
        margin-left: auto;
        font-size: 22px;
        cursor: pointer;
      }

      /* Texto */
      .content {
        position: absolute;
        left: 30px;
        bottom: 180px;
        right: 30px;
        color: white;
        z-index: 5;
      }

      .content h1 {
        font-size: 34px;
        margin-bottom: 10px;
      }

      .content p {
        font-size: 20px;
        line-height: 1.4;
      }

      /* Sticker de mención */
      .mention {
        position: absolute;
        left: 30px;
        bottom: 120px;

        padding: 10px 18px;

        color: white;
        font-size: 20px;
        font-weight: bold;

        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(10px);

        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 14px;

        cursor: pointer;
        transition: 0.25s;
        z-index: 5;
      }

      .mention:hover {
        transform: scale(1.05);
      }

      /* Tarjeta del perfil */
      .profile-card {
        position: absolute;
        left: 30px;
        bottom: 180px;

        width: 270px;

        display: flex;
        align-items: center;
        gap: 12px;

        padding: 11px;

        background: #686868;
        color: white;

        border-radius: 16px;

        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;

        transition: 0.25s;
        z-index: 10;
      }

      .profile-card.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .profile-card img {
        width: 60px;
        height: 60px;
        border-radius: 50%;
      }

      .profile-card .name {
        font-weight: bold;
        margin-bottom: 5px;
      }

      /* Barra inferior */
      .reply {
        position: absolute;
        bottom: 20px;
        left: 18px;
        right: 18px;

        display: flex;
        align-items: center;
        gap: 10px;
        z-index: 5;
      }

      .reply input {
        flex: 1;
        padding: 14px 18px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.5);
        background: transparent;
        color: white;
        outline: none;
      }

      .reply input::placeholder {
        color: #ddd;
      }

      .icon {
        color: white;
        font-size: 24px;
        cursor: pointer;
      }

      .close-btn {
        position: absolute;
        top: 18px;
        right: 16px;

        width: 49px;
        height: 49px;

        border: none;
        border-radius: 50%;

        background: rgba(0, 0, 0, 0.25);
        color: #fff;

        font-size: 28px;
        line-height: 36px;
        cursor: pointer;

        backdrop-filter: blur(6px);
        transition: 0.2s;
      }

      .close-btn:hover {
        background: rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <button class="close-btn" aria-label="Cerrar">&times;</button>
    <div class="story">
      <div class="progress">
        <span></span>
      </div>

      <div class="header">
        <div class="avatar">
          <img src="./yo.jpg" />
        </div>

        <div class="info">
          <div class="user">
            angelito_mkd88 <span class="time">&ensp;21 h</span>
          </div>
        </div>
      </div>

      <div class="content"></div>

      <!-- Sticker de mención -->
      <div class="mention" onclick="toggleProfile()">@labachateramadrid</div>

      <!-- Tarjeta simulada -->
      <div class="profile-card" id="profileCard">
        <img src="./labachateramadrid.jpg" />

        <div>
          <div class="name">labachateramadrid ></div>
        </div>
      </div>

      <div class="reply">
        <input type="text" placeholder="Enviar mensaje..." />
        <div id="fullscreen" class="icon">♡</div>
      </div>
    </div>

    <script>
      function toggleProfile() {
        document.getElementById("profileCard").classList.toggle("show");
      }

      document
        .getElementById("fullscreen")
        .addEventListener("click", async () => {
          await document.documentElement.requestFullscreen();
        });
    </script>
  </body>
</html>
